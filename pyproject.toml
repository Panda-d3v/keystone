[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone"
version = "0.1.0"
description = "Decision integrity for industrial procurement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3", "networkx>=3.4,<4",
  "anthropic>=0.75,<1", "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["infra*", "api*", "contracts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["infra/tests", "tests", "contracts"]
pythonpath = ["."]
